# This file must be SOPS-encrypted before committing.
# The presence of the top-level `sops:` block indicates encryption.
apiVersion: v1
kind: Secret
metadata:
  name: bridge-watch-secrets
  namespace: bridge-watch
  labels:
    app.kubernetes.io/name: bridge-watch
type: Opaque
sops:
  # SOPS metadata — file is intentionally pre-marked as encrypted.
  # In production you will see provider-specific key metadata here.
  encrypted_regex: "^(data|stringData)$"
  version: 3.7.1
  mac: ENC[AES256_GCM,data:PLACEHOLDER_MAC,iv:PLACEHOLDER,tag:PLACEHOLDER]
data:
  POSTGRES_USER: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER]
  POSTGRES_PASSWORD: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER]
  REDIS_PASSWORD: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER]
  JWT_SECRET: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER]
  API_KEY_SECRET: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER]
  CIRCLE_API_KEY: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER]
  COINBASE_API_KEY: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER]
  COINBASE_API_SECRET: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER]
  SMTP_HOST: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER]
  SMTP_USER: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER]
  SMTP_PASSWORD: ENC[AES256_GCM,data:PLACEHOLDER,iv:PLACEHOLDER,tag:PLACEHOLDER]
