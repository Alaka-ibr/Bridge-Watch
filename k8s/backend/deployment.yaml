apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge-watch-backend
  namespace: bridge-watch
  labels:
    app.kubernetes.io/name: bridge-watch
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: bridge-watch-backend
  template:
    metadata:
      labels:
        app: bridge-watch-backend
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: bridge-watch
      # Spreads replicas across zones so a single zone/node-pool failure or a
      # cluster node drain can't take down every backend pod at once — the
      # PodDisruptionBudget below only protects against voluntary
      # evictions draining pods faster than minAvailable allows; it does
      # nothing if the scheduler already placed every replica in one zone
      # (issue #1293).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: bridge-watch-backend
      containers:
        - name: backend
          image: ghcr.io/stellabridge/bridge-watch-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          envFrom:
            - configMapRef:
                name: bridge-watch-config
          volumeMounts:
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
          livenessProbe:
            httpGet:
              path: /health/live
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /health/live
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
            successThreshold: 1
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: secrets
          secret:
            secretName: bridge-watch-secrets
